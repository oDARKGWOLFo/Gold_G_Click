<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold_G_Click</title>
    
    <!-- ПОДКЛЮЧЕНИЕ SDK ТЕЛЕГРАМ И ADSGRAM -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.live/js/sad.min.js"></script>
    <style>
        /* ГЛОБАЛЬНЫЕ СТИЛИ (СТРОГО ПО СКРИНШОТУ) */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000; /* Черный матовый фон */
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* КОНТЕЙНЕР ГЛАВНОГО МЕНЮ */
        .main-menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 85%;
            max-width: 340px;
            background: #000000;
            border: 2px solid #ffca28; /* Ярко-золотая рамка вокруг меню */
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 20px rgba(255, 202, 40, 0.15);
        }

        /* КНОПКИ ГЛАВНОГО МЕНЮ */
        .menu-btn {
            background: none;
            border: 1.5px solid #ffca28; /* Ярко-золотая рамка для каждой кнопки */
            color: #ffca28; /* Ярко-золотой текст */
            border-radius: 12px;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s ease, color 0.15s ease;
            width: 100%;
        }
        .menu-btn:active {
            background: #ffca28;
            color: #000000;
        }

        /* СТИЛИ ДЛЯ ЭКРАНОВ РАЗДЕЛОВ */
        .screen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen-content {
            width: 85%;
            max-width: 340px;
            background: #000000;
            border: 2px solid #ffca28; /* Ярко-золотая рамка раздела */
            border-radius: 20px;
            padding: 25px 20px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        .back-to-menu-btn {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.4rem;
            color: #ffca28;
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
        }
        .screen-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            color: #ffca28;
        }

        /* ПАНЕЛЬ БАЛАНСОВ НА ЭКРАНЕ КЛИКА */
        .click-balance-display {
            background: #000000;
            border: 1px solid #ffca28; /* Переведено на ярко-золотую рамку */
            border-radius: 14px;
            width: 100%;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .gold-row { color: #ffffff; font-size: 1.25rem; margin-bottom: 4px; }
        .diam-row { color: #a855f7; font-size: 1.05rem; }

        /* КРУГЛАЯ МОНЕТА ДЛЯ ТАПОВ */
        .coin-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .round-coin-btn {
            background: none; border: none; outline: none;
            cursor: pointer;
            transition: transform 0.05s ease;
        }
        .round-coin-btn:active { transform: scale(0.95); }
        .coin-img {
            width: 190px; height: 190px;
            filter: drop-shadow(0 0 15px rgba(255, 202, 40, 0.2));
        }

        /* КАРТОЧКА ВНУТРИ МАГАЗИНА */
        .item-card {
            background: #000000;
            border: 1px solid #ffca28; /* Переведено на ярко-золотую внутреннюю рамку */
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }
        .item-card-btn {
            background: none;
            border: 1.5px solid #ffca28;
            color: #ffca28;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.1s ease;
        }
        .item-card-btn:active { background: #ffca28; color: #000000; }

        /* СТРОКИ ДЛЯ ЛИДЕРБОРДА */
        .leader-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 202, 40, 0.2); /* Тонкая ярко-золотая полоска разделения */
            font-size: 0.9rem;
        }
        .ldr-pos { font-weight: bold; color: #ffca28; width: 35px; }
        .ldr-name { flex: 1; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ldr-prize { font-weight: bold; color: #00e5ff; }

        /* ОКНО ПОДТВЕРЖДЕНИЯ (CONFIRM) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }
        .confirm-box { text-align: center; padding: 5px; }
        .confirm-text { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 22px; line-height: 1.4; }
        .confirm-buttons-row { display: flex; gap: 15px; justify-content: center; }
        .confirm-choice-btn {
            background: none; border: 1.5px solid #ffffff; color: white;
            padding: 9px 18px; border-radius: 10px; font-weight: bold; font-size: 0.88rem;
            cursor: pointer; min-width: 105px;
        }
        .confirm-choice-btn.yes { border-color: #ffca28; color: #ffca28; }
    </style>
</head>
<body>

    <!-- ==================================================== -->
    <!-- ГЛАВНОЕ МЕНЮ ИГРЫ (ОТКРЫВАЕТСЯ ПРИ ВХОДЕ)           -->
    <!-- ==================================================== -->
    <div id="mainMenuScreen" class="main-menu-container">
        <!-- Заголовок Главная сверху -->
        <div style="font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 20px; color: #ffca28; position: relative;">
            Главная
            <span style="position: absolute; right: 0; top: -2px; font-size: 1.3rem; color: #ffca28; cursor: pointer;" onclick="tg?.close();">&times;</span>
        </div>
        
        <!-- Три основные кнопки выбора -->
        <button class="menu-btn" onclick="NavModule.showScreen('playScreen')">Играть</button>
        <button class="menu-btn" onclick="NavModule.showScreen('leaderboardScreen')">Топ 100 игроков</button>
        <button class="menu-btn" onclick="NavModule.showScreen('shopScreen')">Магазин</button>
    </div>


    <!-- ==================================================== -->
    <!-- РАЗДЕЛ 1: ЭКРАН «ИГРА» (ЧИСТЫЙ КЛИКЕР)              -->
    <!-- ==================================================== -->
    <div id="playScreen" class="screen-overlay">
        <div class="screen-content">
            <!-- Кнопка выхода в главное меню -->
            <span class="back-to-menu-btn" onclick="NavModule.backToMenu()">&times;</span>
            <div class="screen-title">Игра</div>
            
            <!-- Информационная панель двух балансов -->
            <div class="click-balance-display">
                <div class="gold-row">🪙 <span id="gameGoldBal">0</span> G</div>
                <div class="diam-row">💎 <span id="gameDiamBal">0</span></div>
            </div>

            <!-- Круглая монета для бесконечных тапов -->
            <div class="coin-box">
                <button class="round-coin-btn" onclick="AppLogic.tapCoin()">
                    <svg class="coin-img" viewBox="0 0 100 100" xmlns="http://w3.org">
                        <circle cx="50" cy="50" r="46" fill="#000000" stroke="#ffca28" stroke-width="2"/>
                        <circle cx="50" cy="50" r="38" fill="none" stroke="#ffca28" stroke-width="1" stroke-dasharray="3 3"/>
                        <text x="50" y="58" font-family="inherit" font-size="24" font-weight="bold" fill="#ffca28" text-anchor="middle">G</text>
                    </svg>
                </button>
            </div>
        </div>
    </div>


    <!-- ==================================================== -->
    <!-- РАЗДЕЛ 2: ЭКРАН «ТОП 100 ИГРОКОВ»                   -->
    <!-- ==================================================== -->
    <div id="leaderboardScreen" class="screen-overlay">
        <div class="screen-content">
            <!-- Кнопка выхода в главное меню -->
            <span class="back-to-menu-btn" onclick="NavModule.backToMenu()">&times;</span>
            <div class="screen-title">Топ 100 игроков</div>
            
            <!-- Индикатор общего фонда от рекламы -->
            <div style="font-size: 1.05rem; color: #ffca28; font-weight: bold; margin-bottom: 5px; text-align: center;">
                💰 Общий фонд: <span id="prizePoolTxt">1684</span> 💎
            </div>
            <div id="seasonTimerDisplay" style="text-align: center; font-size: 0.8rem; color: #8986a3; margin-bottom: 15px;">До обнуления: --</div>
            
            <!-- Динамические строки лидерборда -->
            <div id="htmlLeaderboardRows"></div>
        </div>
    </div>


    <!-- ==================================================== -->
    <!-- РАЗДЕЛ 3: ЭКРАН «МАГАЗИН» (ТОЛЬКО РЕКЛАМНЫЙ БОНУС)  -->
    <!-- ==================================================== -->
    <div id="shopScreen" class="screen-overlay">
        <div class="screen-content">
            <!-- Кнопка выхода в главное меню -->
            <span class="back-to-menu-btn" onclick="NavModule.backToMenu()">&times;</span>
            <div class="screen-title">Магазин</div>
            
            <!-- Единственная карточка — рекламный бонус -->
            <div class="item-card">
                <div style="font-size: 0.95rem; font-weight: bold; color: #ff4a4a;">🎬 Рекламный бонус</div>
                <div style="font-size: 0.8rem; color: #8986a3;">Посмотрите ролик AdsGram, чтобы забрать <span style="color: #ffca28;">+1 Алмаз 💎</span></div>
                <button class="item-card-btn" style="border-color: #ff4a4a; color: #ff4a4a;" onclick="AppLogic.openConfirmModal()">Забрать бонус</button>
            </div>
        </div>
    </div>


    <!-- ВССПЛЫВАЮЩЕЕ ОКНО ПОДТВЕРЖДЕНИЯ ДЕЙСТВИЯ (CONFIRM) -->
    <div id="confirmActionModal" class="modal">
        <div class="modal-content" style="max-width: 320px; border-color: #ffca28;">
            <div class="modal-title" style="color: #ffca28; font-size: 1.1rem;">Подтвердить действие?</div>
            <div class="confirm-box">
                <div class="confirm-text">Вы действительно хотите посмотреть рекламу? После просмотра вам будет начислен 1 Алмаз 💎.</div>
                <div class="confirm-buttons-row">
                    <button class="confirm-choice-btn" onclick="AppLogic.closeConfirmModal(false)">ОТМЕНИТЬ</button>
                    <button class="confirm-choice-btn yes" onclick="AppLogic.closeConfirmModal(true)">ПОДТВЕРДИТЬ</button>
                </div>
            </div>
        </div>
                </div>
                <script>
        // ====================================================
        // 1. ХРАНИЛИЩЕ ДАННЫХ И СИНХРОНИЗАЦИЯ С ПАМЯТЬЮ
        // ====================================================
        const GameStore = {
            gold: parseInt(localStorage.getItem('g_click_gold')) || 0,
            diamonds: parseInt(localStorage.getItem('g_click_diamonds')) || 0,
            clickPower: 1, // Базовый бесконечный клик равен +1 G
            
            // Базовый стартовый фонд по твоей 3Х-модели
            totalPrizePool: parseFloat(localStorage.getItem('g_prize_pool')) || 1684,
            nextResetTime: parseInt(localStorage.getItem('g_next_reset')) || 0,
            localLeaderboardList: []
        };

        // Инициализация Telegram SDK
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function syncAndRefreshUI() {
            document.getElementById('gameGoldBal').innerText = Math.floor(GameStore.gold);
            document.getElementById('gameDiamBal').innerText = GameStore.diamonds;
            
            if(document.getElementById('prizePoolTxt')) document.getElementById('prizePoolTxt').innerText = Math.floor(GameStore.totalPrizePool);

            // Запись данных в память устройства
            localStorage.setItem('g_click_gold', GameStore.gold.toString());
            localStorage.setItem('g_click_diamonds', GameStore.diamonds.toString());
            localStorage.setItem('g_prize_pool', GameStore.totalPrizePool.toString());
            localStorage.setItem('g_next_reset', GameStore.nextResetTime.toString());
        }

        // ====================================================
        // 2. МОДУЛЬ НАВИГАЦИИ (УПРАВЛЕНИЕ ОКНАМИ)
        // ====================================================
        const NavModule = {
            showScreen: function(screenId) {
                // Прячем главное меню и все оверлеи
                document.getElementById('mainMenuScreen').style.display = 'none';
                document.querySelectorAll('.screen-overlay').forEach(scr => scr.style.display = 'none');
                
                // Включаем выбранный экран
                document.getElementById(screenId).style.display = 'flex';
                
                // При открытии ТОП 100 обновляем позиции
                if (screenId === 'leaderboardScreen') {
                    LeaderboardModule.refreshLeaderboard();
                }
            },
            backToMenu: function() {
                // Закрываем разделы и выводим Главную панель на экран
                document.querySelectorAll('.screen-overlay').forEach(scr => scr.style.display = 'none');
                document.getElementById('mainMenuScreen').style.display = 'flex';
            }
        };

        // ====================================================
        // 3. ИГРОВАЯ ЛОГИКА (КЛИКЕР, CONFIRM И СЕТЬ ADSGRAM)
        // ====================================================
        const AppLogic = {
            tapCoin: function() {
                // Бесконечный клик по монете
                GameStore.gold += GameStore.clickPower;
                syncAndRefreshUI();
                LeaderboardModule.refreshLeaderboard();
            },

            openConfirmModal: function() {
                document.getElementById('confirmActionModal').style.display = 'flex';
            },

            closeConfirmModal: function(isConfirmed) {
                document.getElementById('confirmActionModal').style.display = 'none';
                if (isConfirmed) {
                    this.executeAdsGramCall();
                }
            },

            executeAdsGramCall: function() {
                const AdController = window.AdsGram?.createAdListener({ blockId: "44331" });
                
                if (AdController) {
                    AdController.show()
                        .then((result) => {
                            GameStore.diamonds += 1;
                            GameStore.totalPrizePool += 1; // Растет весь фонд одновременно
                            
                            syncAndRefreshUI();
                            LeaderboardModule.renderHTML();
                            alert("🎉 Награда получена! Вам начислен +1 Алмаз 💎. Общий фонд турнира увеличен!");
                        })
                        .catch((err) => {
                            alert("Реклама не загрузилась. Попробуйте еще раз позже.");
                        });
                } else {
                    // Тест в браузере вне Телеграма
                    GameStore.diamonds += 1;
                    GameStore.totalPrizePool += 1;
                    syncAndRefreshUI();
                    LeaderboardModule.renderHTML();
                    alert("📺 Тест: Реклама просмотрена! Получен +1 💎");
                }
            }
        };
                    // ====================================================
        // 4. МАТЕМАТИЧЕСКИЙ МОДУЛЬ ТУРНИРА ТОП 100 ИГРОКОВ
        // ====================================================
        const LeaderboardModule = {
            refreshLeaderboard: function() {
                // Если таблица пустая — генерируем 99 ботов для создания конкуренции
                if (GameStore.localLeaderboardList.length === 0) {
                    for (let i = 1; i <= 99; i++) {
                        GameStore.localLeaderboardList.push({
                            id: i,
                            name: `User_Click_${Math.floor(Math.random() * 9000 + 1000)}`,
                            gold: Math.floor(48000 - (i * 450)),
                            isMe: false
                        });
                    }
                }

                // ПОДТЯГИВАЕМ НАСТОЯЩЕЕ ИМЯ ИЛИ ЮЗЕРНЕЙМ ИЗ ТЕЛЕГРАМА
                let telegramName = "Игрок";
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                    telegramName = tgUser.username ? `@${tgUser.username}` : `${tgUser.first_name}`;
                } else {
                    // Локальная заглушка для тестов в обычном браузере
                    telegramName = localStorage.getItem('g_player_mock_name') || `User_Click_${Math.floor(Math.random() * 8000 + 1000)}`;
                    localStorage.setItem('g_player_mock_name', telegramName);
                }

                const myProfile = { 
                    id: "me", 
                    name: telegramName, // Настоящий ник игрока выводится на экран!
                    gold: GameStore.gold, 
                    isMe: true 
                };
                
                const myOldIndex = GameStore.localLeaderboardList.findIndex(p => p.isMe);
                if (myOldIndex !== -1) GameStore.localLeaderboardList.splice(myOldIndex, 1);
                
                GameStore.localLeaderboardList.push(myProfile);
                // Сортируем строго по золоту сверху вниз
                GameStore.localLeaderboardList.sort((a, b) => b.gold - a.gold);
                
                this.renderHTML();
            },

            renderHTML: function() {
                const targetList = document.getElementById('htmlLeaderboardRows');
                if (!targetList) return;
                targetList.innerHTML = "";

                // Срез строго первой сотни участников таблицы
                const activeTop100 = GameStore.localLeaderboardList.slice(0, 100);

                activeTop100.forEach((player, idx) => {
                    const pos = idx + 1;
                    let calculatedReward = 0;

                    // Умное процентное деление общего фонда (защита от перевернутых наград)
                    if (pos === 1) calculatedReward = Math.round(GameStore.totalPrizePool * 0.25);
                    else if (pos === 2) calculatedReward = Math.round(GameStore.totalPrizePool * 0.15);
                    else if (pos === 3) calculatedReward = Math.round(GameStore.totalPrizePool * 0.10);
                    else if (pos >= 4 && pos <= 10) calculatedReward = Math.round((GameStore.totalPrizePool * 0.14) / 7);
                    else if (pos >= 11 && pos <= 30) calculatedReward = Math.round((GameStore.totalPrizePool * 0.20) / 20);
                    else if (pos >= 31 && pos <= 60) calculatedReward = Math.round((GameStore.totalPrizePool * 0.12) / 30);
                    else if (pos >= 61 && pos <= 100) calculatedReward = Math.round((GameStore.totalPrizePool * 0.04) / 40);

                    if (calculatedReward < 1) calculatedReward = 1; // Защита от нуля

                    const rowDiv = document.createElement('div');
                    rowDiv.className = `leader-row ${player.isMe ? 'me' : ''}`;
                    rowDiv.innerHTML = `
                        <span class="ldr-pos">${pos}</span>
                        <span class="ldr-name" style="flex: 1.2;">${player.name}</span>
                        <span style="flex: 1; color: #ffca28; font-size: 0.85rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 5px;">🪙 ${Math.floor(player.gold).toLocaleString()}</span>
                        <span class="ldr-prize" style="flex: 0.8; text-align: right; white-space: nowrap;">${calculatedReward} 💎</span>
                    `;
                    targetList.appendChild(rowDiv);
                });
            },

            initTimer: function() {
                if (!GameStore.nextResetTime) {
                    GameStore.nextResetTime = Date.now() + (7 * 24 * 60 * 60 * 1000); // Сезон равен 7 дням
                }

                setInterval(() => {
                    const tDiff = GameStore.nextResetTime - Date.now();
                    if (tDiff <= 0) {
                        alert("⏱ Сезон завершен! Балансы золота G сброшены, новый раунд турнира начался.");
                        GameStore.gold = 0;
                        GameStore.totalPrizePool = 1684;
                        GameStore.nextResetTime = Date.now() + (7 * 24 * 60 * 60 * 1000);
                        syncAndRefreshUI();
                        this.refreshLeaderboard();
                        return;
                    }
                    const d = Math.floor(tDiff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((tDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((tDiff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((tDiff % (1000 * 60)) / 1000);
                    
                    document.getElementById('seasonTimerDisplay').innerText = `До обнуления: ${d}д ${h}ч ${m}м ${s}с`;
                }, 1000);
            }
        };

        // ====================================================
        // 5. ЗАПУСК ИГРОВОГО ЯДРА ДЛЯ СТАРТА ПРИ ЗАГРУЗКЕ
        // ====================================================
        document.addEventListener("DOMContentLoaded", () => {
            syncAndRefreshUI();
            LeaderboardModule.refreshLeaderboard();
            LeaderboardModule.initTimer();
        });
    </script>
</body>
</html>
