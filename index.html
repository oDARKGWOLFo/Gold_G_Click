<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold G Clicker</title>
    
    <!-- ПОДКЛЮЧЕНИЕ СИСТЕМ ADSGRAM И TELEGRAM WEB APP -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .nav-btn {
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:active {
            background: rgba(255, 215, 0, 0.2);
        }

        /* Панель баланса по центру */
        .balance-container {
            border: 2px solid #FFD700;
            border-radius: 12px;
            padding: 10px 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            min-width: 160px;
        }
        .balance-item {
            font-size: 18px;
            font-weight: bold;
            color: #FFFFFF;
            margin: 2px 0;
        }
        .gold-text { color: #FFD700; }
        .diamond-text { color: #00E5FF; }
        /* Зона клика */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 15px;
        }
        .coin-btn {
            background: transparent;
            border: none;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transition: transform 0.05s;
        }
        .coin-btn:active {
            transform: scale(0.92);
            outline: none;
        }
        .coin-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .info-text {
            font-size: 14px;
            font-weight: bold;
            color: #00E5FF;
            letter-spacing: 0.5px;
            text-align: center;
            margin-top: 5px;
        }

        .timer-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px dashed #FFD700;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            color: #FFD700;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Кнопка рекламы */
        .ad-btn {
            width: 100%;
            max-width: 350px;
            background: linear-gradient(180deg, #FFD700 0%, #B8860B 100%);
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
            margin-bottom: 10px;
        }
        .ad-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #111111;
            border: 2px solid #FFD700;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .modal-title {
            color: #FFD700;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #FFD700;
            font-size: 24px;
            cursor: pointer;
        }
        
        .leaderboard-list {
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 10px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 5px;
            border-bottom: 1px solid #222;
            font-size: 14px;
            align-items: center;
        }
        .my-row {
            background: rgba(255, 215, 0, 0.15);
            font-weight: bold;
            color: #FFD700;
        }
        
        .shop-item-box {
            background: #1a1a1a;
            border: 1px solid #FFD700;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .action-btn {
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .action-btn:active {
            background: rgba(255, 215, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="nav-btn" onclick="openModal('leaderboardModal')">🏆 ТОП 100</button>
        <div class="balance-container">
            <div class="balance-item"><span id="goldBalance">0</span> <span class="gold-text">G</span></div>
            <div class="balance-item"><span id="diamondBalance">0</span> <span class="diamond-text">💎</span></div>
        </div>
        <button class="nav-btn" onclick="openModal('shopModal')">🏪 Магазин</button>
    </div>
    <div id="ad-timer" style="display: none; text-align: center; font-size: 1.2rem; color: #ff9900; margin: 10px 0; font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);">Бонус x10: 10:00</div>

    <div class="game-area">
        <button class="coin-btn" onclick="clickCoin()">
            <svg class="coin-img" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#FFD700" stroke="#B8860B" stroke-width="4"/>
                <circle cx="50" cy="50" r="37" fill="#FFD700" stroke="#DAA520" stroke-width="2" stroke-dasharray="4"/>
                <text x="50" y="58" font-size="26" font-weight="bold" fill="#B8860B" text-anchor="middle">G</text>
            </svg>
        </button>
        <div id="click-power-display" class="info-text">КЛИК: +1 G</div>
    </div>

    <button class="ad-btn" onclick="showAd()">
        🎬 Посмотреть рекламу (+1💎)
    </button>

    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('leaderboardModal')">&times;</span>
            <div class="modal-title">Топ 100 игроков</div>
            <div id="seasonTimer" class="timer-box">До обнуления: --д --ч --м --с</div>
            <div class="leaderboard-list" id="leaderboardList"></div>
        </div>
    </div>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('shopModal')">&times;</span>
            <div class="modal-title">Магазин</div>
            <div class="shop-item-box">
                Обмен валюты:<br><b class="gold-text">10 000 G</b> ➡️ <b class="diamond-text">1 Алмаз 💎</b>
                <button class="action-btn" onclick="buyDiamond()">Обменять</button>
            </div>
            <div class="shop-item-box">
                Улучшение монеты:<br><b class="diamond-text">100 Алмазов 💎</b> ➡️ <b>+1 за клик навсегда</b>
                <button class="action-btn" onclick="buyClickUpgrade()">Купить апгрейд</button>
            </div>
        </div>
    </div>

    <script>
        let gold = parseInt(localStorage.getItem('clicker_gold')) || 0;
        let diamonds = parseInt(localStorage.getItem('clicker_diamonds')) || 0;
        let clickPower = parseInt(localStorage.getItem('clicker_power')) || 1;
        let nextResetTime = parseInt(localStorage.getItem('next_reset_time')) || 0;

        let AdController = null;
        let bonusEndTime = 0;
        const botNames = ["Ivan_Pro", "CryptoKing", "MiniApp_Dev", "Shadow", "Alex777", "Luna", "ClickMaster", "Digger", "CyberUser", "Phoenix"];
        let leaderData = [];

        function updateUI() {
            const goldEl = document.getElementById('goldBalance');
            const diamondEl = document.getElementById('diamondBalance');
            const powerEl = document.getElementById('click-power-display');

            if (goldEl) goldEl.innerText = gold;
            if (diamondEl) diamondEl.innerText = diamonds;
            if (powerEl) powerEl.innerText = `КЛИК: +${clickPower} G`;
            
            localStorage.setItem('clicker_gold', gold.toString());
            localStorage.setItem('clicker_diamonds', diamonds.toString());
            localStorage.setItem('clicker_power', clickPower.toString());
            localStorage.setItem('next_reset_time', nextResetTime.toString());
            const timerEl = document.getElementById('ad-timer');
    if (timerEl) {
        let timeLeft = bonusEndTime - Date.now();
        if (timeLeft > 0) {
            let minutes = Math.floor(timeLeft / 60000);
            let seconds = Math.floor((timeLeft % 60000) / 1000);
            if (seconds < 10) seconds = '0' + seconds;
            timerEl.innerText = `Бонус x10: ${minutes}:${seconds}`;
            timerEl.style.display = 'block';
        } else {
            timerEl.style.display = 'none';
        }
    }
        }

        function syncWithTelegramCloud() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.getItems(['cloud_gold', 'cloud_diamonds', 'cloud_power', 'cloud_reset_time'], (err, values) => {
                    if (!err && values) {
                        let cloudGold = parseInt(values.cloud_gold) || 0;
                        let cloudDiamonds = parseInt(values.cloud_diamonds) || 0;
                        let cloudPower = parseInt(values.cloud_power) || 1;
                        let cloudResetTime = parseInt(values.cloud_reset_time) || 0;

                        if (cloudGold > gold) gold = cloudGold;
                        if (cloudDiamonds > diamonds) diamonds = cloudDiamonds;
                        if (cloudPower > clickPower) clickPower = cloudPower;
                        if (cloudResetTime > nextResetTime && cloudResetTime !== 0) nextResetTime = cloudResetTime;

                        checkSeasonStatus();
                        updateUI();
                        generateLeaderboard();
                    }
                });
            }
        }

        function saveDataToCloud() {
            updateUI();
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.setItem('cloud_gold', gold.toString());
                window.Telegram.WebApp.CloudStorage.setItem('cloud_diamonds', diamonds.toString());
                window.Telegram.WebApp.CloudStorage.setItem('cloud_power', clickPower.toString());
                window.Telegram.WebApp.CloudStorage.setItem('cloud_reset_time', nextResetTime.toString());
            }
        }

        function clickCoin() {
            if (Date.now() < bonusEndTime) {
        gold += 10;
    } else {
        gold += clickPower;
            }
            updateUI();
            saveDataToCloud(); 
            generateLeaderboard();
        }

        function buyDiamond() {
            if (gold >= 10000) {
                gold -= 10000;
                diamonds += 1;
                saveDataToCloud();
                generateLeaderboard();
                alert("Успешный обмен! Вы получили 1 алмаз 💎");
            } else {
                alert("Недостаточно золота (G) для обмена! Требуется 10 000 G.");
            }
        }

        function buyClickUpgrade() {
            if (diamonds >= 100) {
                diamonds -= 100;
                clickPower += 1;
                saveDataToCloud();
                alert(`Улучшение куплено! Теперь каждый клик приносит +${clickPower} G 🚀`);
            } else {
                alert("Недостаточно алмазов 💎 для покупки апгрейда!");
            }
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function checkSeasonStatus() {
            const now = Date.now();
            if (nextResetTime === 0) {
                nextResetTime = now + (7 * 24 * 60 * 60 * 1000);
                saveDataToCloud();
            }
            if (now >= nextResetTime) {
                generateLeaderboard();
                const myRankIndex = leaderData.findIndex(player => player.isMe);
                const myRankPosition = myRankIndex + 1; 
                
                let rewardDiamonds = 0;
                if (myRankPosition === 1) rewardDiamonds = 100;
                else if (myRankPosition === 2) rewardDiamonds = 50;
                else if (myRankPosition === 3) rewardDiamonds = 10;

                if (rewardDiamonds > 0) {
                    diamonds += rewardDiamonds;
                    alert(`Сезон окончен! Вы заняли ${myRankPosition} место и выиграли ${rewardDiamonds} 💎!`);
                } else {
                    alert(`Сезон окончен! Вы заняли ${myRankPosition} место. Попробуйте на следующей неделе!`);
                }

                gold = 0; 
                nextResetTime = Date.now() + (7 * 24 * 60 * 60 * 1000);
                saveDataToCloud();
            }
                }
        function startTimerCountdown() {
            setInterval(() => {
                const timerEl = document.getElementById('seasonTimer');
                if (!timerEl) return;
                
                const now = Date.now();
                const timeLeft = nextResetTime - now;
                
                if (timeLeft <= 0) {
                    checkSeasonStatus();
                    return;
                }
                
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                
                timerEl.innerText = `До обнуления: ${days}д ${hours}ч ${minutes}м ${seconds}с`;
            }, 1000);
        }

        function generateLeaderboard() {
            leaderData = [];
            let telegramName = "Вы (Выбранный профиль)";
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                telegramName = user.first_name + (user.last_name ? " " + user.last_name : "");
            }
            
            leaderData.push({ name: telegramName, score: gold, isMe: true });
            
            for (let i = 1; i <= 99; i++) {
                let botIndex = i % botNames.length;
                let botScore = 8000 - (i * 80) + (i % 3 === 0 ? 30 : -20); 
                if (botScore < 0) botScore = 0;
                leaderData.push({ name: `${botNames[botIndex]}_${i}`, score: botScore, isMe: false });
            }

            leaderData.sort((a, b) => b.score - a.score);

            const listEl = document.getElementById('leaderboardList');
            if (listEl) {
                listEl.innerHTML = '';
                leaderData.forEach((player, index) => {
                    const position = index + 1;
                    let badge = `${position}. `; 
                    
                    if (position === 1) badge = "100💎 🏆 ";
                    if (position === 2) badge = "50💎 🥈 ";
                    if (position === 3) badge = "10💎 🥉 ";

                    const item = document.createElement('div');
                    item.className = 'leaderboard-item' + (player.isMe ? ' my-row' : '');
                    item.innerHTML = `<span>${badge}${player.name}</span><span>${player.score} G</span>`;
                    listEl.appendChild(item);
                });
            }
        }

        function showAd() {
            if (!AdController) {
               // alert("Режим отладки: Рекламный блок настраивается. Начислено +500 G");
               // gold += 500;
                //updateUI();
                //saveDataToCloud();
                //return;
            }

            AdController.show()
                .then((result) => {
                    let startTime = Date.now() < bonusEndTime ? bonusEndTime : Date.now();
            bonusEndTime = startTime + (10 * 60 * 1000);
            updateUI();
            saveDataToCloud();
            alert("Бонус активирован! +10 G за клик на 10 минут!");
                })
                .catch((result) => {
                    console.error("Ad error:", result);
                    alert("Реклама не была досмотрена или возникла ошибка соединения.");
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateUI();            
            checkSeasonStatus();   
            generateLeaderboard(); 
            startTimerCountdown(); 
            
            // СИНТАКСИС ПОДКЛЮЧЕНИЯ ИЗ ВАШЕЙ ВТОРОЙ ИГРЫ
            // ЗАМЕНИТЕ "43566" НА ВАШ НОВЫЙ ID БЛОКА ИЗ ADSGRAM
            if (window.Adsgram && window.Adsgram.init) {
    AdController = window.Adsgram.init({ blockId: "44080" }); 
            }
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            
            syncWithTelegramCloud(); 
        });
        // Пассивный доход: +1 G каждые 10 секунд
    setInterval(() => {
        gold += 1;
        if (typeof updateUI === "function") updateUI();
    }, 1000);
    </script>
</body>
</html>
